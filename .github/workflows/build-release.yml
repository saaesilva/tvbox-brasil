name: Build Executável TVBox

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Python 3.12 (x64)
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        architecture: 'x64'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compilar Executável com PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "TutuTV-Box-Brasil" TVBox.py

    - name: Upload do Artefato Compilado
      uses: actions/upload-artifact@v4
      with:
        name: TutuTV-Box-Brasil-exe
        path: dist/TutuTV-Box-Brasil.exe
